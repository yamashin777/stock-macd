name: Keep Render app awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent Render free-tier sleep
        run: curl -sf --max-time 30 https://stock-macd.onrender.com/ -o /dev/null || echo "ping failed (app may be waking up)"
